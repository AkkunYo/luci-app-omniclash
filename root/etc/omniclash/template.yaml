# ==============================================================================
# OmniClash 生产级核心模板 (100% 独立自主配置，绝不依赖写入外部插件)
# ==============================================================================

use_providers: &use_providers
  use: [sub_provider_1, sub_provider_4, sub_provider_3, sub_provider_2]

pr: &pr
  type: select
  proxies: [🚀 节点选择, ♻️ 自动选择, ☢ 负载均衡-散列, ☢ 负载均衡-轮询, 🌐 全部节点, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡, 🇰🇷 韩国, 🇺🇲 美国节点, 🇩🇪 德国节点, 🇬🇧 英国节点, 🧿 其它地区, 🏠 住宅落地, 🟢 直连]

best: &best
  type: url-test
  interval: 300
  tolerance: 50
  lazy: true
  <<: *use_providers

health: &health
  enable: true
  url: https://www.gstatic.com/generate_204
  interval: 300

override: &override
  udp: true
  skip-cert-verify: true

proxy-providers:
  sub_provider_1:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://sub.example.com/vps.txt"
    override:
      <<: *override
      additional-prefix: "vc_"
      up: "50 Mbps"
      down: "200 Mbps"

  socks5vps:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://sub.example.com/socks5.txt"
    override:
      udp: false
      skip-cert-verify: true
      additional-prefix: "s5v_"
      dialer-proxy: 🔗 前置入口

  sub_provider_2:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://sub.example.com/sub?token=your_token_1"
    exclude-type: "ss|http|vmess"
    override:
      <<: *override
      additional-prefix: "hth_"

  sub_provider_3:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://sub.example.com/sub?token=your_token_2"
    exclude-type: "ss|http|vmess"
    override:
      <<: *override
      additional-prefix: "hx_"

  sub_provider_4:
    type: http
    interval: 1800
    health-check: *health
    proxy: 🟢 直连
    url: "https://sub.example.com/hysteria.txt"
    filter: "^((?!(中国|china|cn)).)*$"
    exclude-type: "ss|http|vmess"
    override:
      <<: *override
      additional-prefix: "gh_"

rule-providers:
  reject_ad:
    type: http
    behavior: domain
    url: "https://hk.gh-proxy.org/https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject_ad.yaml
    interval: 86400

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false

external-ui: ui
external-controller: :9090
secret: clashclash

unified-delay: true
tcp-concurrent: true
enable-process: false
find-process-mode: "off"
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 12
global-ua: "clash.meta"

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip: "https://hk.gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://hk.gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://hk.gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
  asn: "https://hk.gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

# TUN 系统级直接内嵌
tun:
  enable: true
  device: omniclash
  stack: system
  mtu: 1500
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

hosts: {}

# DNS 模块直接内嵌
dns:
  enable: true
  use-hosts: true
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - tls://223.5.5.5
    - tls://119.29.29.29

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - '*.cloudflare.com'
    - '*.cloudflared.com'
    - '*.cloudflare-dns.com'
    - '*.cloudflare.net'
    - time.*.com
    - ntp.*.com
    - +.xiaomi.com
    - localhost.ptlogin2.qq.com
    - geosite:private
    - geosite:cn

  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query

  nameserver-policy:
    "+.gh-proxy.org,+.ghfast.top": https://223.5.5.5/dns-query
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "geosite:category-ads-all": rcode://success
    "rule-set:reject_ad": rcode://success
    "geosite:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"

proxies:
  - name: "🛑 黑洞"
    type: reject
  - name: "🟢 直连"
    type: direct
    udp: true

proxy-groups:
  - {name: 🎯 专线-Tallflix-自动, type: url-test, use: [sub_provider_1], filter: "(?i)Tallflix", tolerance: 50, interval: 300, lazy: true, hidden: true}
  - {name: 🎯 专线-Tallflix, type: select, use: [sub_provider_1], filter: "(?i)Tallflix", proxies: [🎯 专线-Tallflix-自动, 🛑 黑洞, 🟢 直连], icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Server.png}

  - {name: 🎯 专线-Snacky-自动, type: url-test, use: [sub_provider_1], filter: "(?i)Snacky", tolerance: 50, interval: 300, lazy: true, hidden: true}
  - {name: 🎯 专线-Snacky, type: select, use: [sub_provider_1], filter: "(?i)Snacky", proxies: [🎯 专线-Snacky-自动, 🛑 黑洞, 🟢 直连], icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Server.png}

  - {name: 🎯 专线-Realith-自动, type: url-test, use: [sub_provider_1], filter: "(?i)Realith", tolerance: 50, interval: 300, lazy: true, hidden: true}
  - {name: 🎯 专线-Realith, type: select, use: [sub_provider_1], filter: "(?i)Realith", proxies: [🎯 专线-Realith-自动, 🛑 黑洞, 🟢 直连], icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Server.png}

  - {name: 🚀 节点选择, type: select, icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Proxy.png, proxies: [🇭🇰 香港节点, ♻️ 自动选择, ☢ 负载均衡-散列, ☢ 负载均衡-轮询, 🌐 全部节点, 🏠 住宅落地, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡, 🇰🇷 韩国, 🇺🇲 美国节点, 🇩🇪 德国节点, 🇬🇧 英国节点, 🧿 其它地区, 🟢 直连]}
