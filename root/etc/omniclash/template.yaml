  - {name: ☢ 负载均衡-散列, type: load-balance, strategy: consistent-hashing, interval: 300, <<: *use_providers, filter: "^((?!(直连)).)*$", icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Round_Robin_1.png }
  - {name: ☢ 负载均衡-轮询, type: load-balance, strategy: round-robin, interval: 300, <<: *use_providers, filter: "^((?!(直连)).)*$", icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Round_Robin.png }
  
  - {name: 🔗 前置入口, type: select, proxies: [♻️ 自动选择], <<: *use_providers, icon: https://hk.gh-proxy.org/https://raw.githubusercontent.com/Koolson/Qure/refs/heads/master/IconSet/Color/Server.png}

